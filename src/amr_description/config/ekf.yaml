ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    print_diagnostics: false

    map_frame:       map
    odom_frame:      odom
    base_link_frame: base_footprint
    world_frame:     odom

    # ── SENSOR 1: Odometri Encoder Roda (/odom dari odom_node) ──────────────
    # Menyumbangkan: posisi X,Y  dan kecepatan linear Vx + kecepatan rotasi Vyaw
    # Format: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0: /odom
    odom0_config: [true,  true,  false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10

    # ── SENSOR 2: IMU BNO08x via Teensy (/imu/data_fixed dari imu_fixer_node) ─
    # Hanya gunakan YAW (orientation[5]) untuk koreksi sudut hadap.
    # Vx, Vyaw tetap dari encoder (odom0) — IMU TIDAK menyumbang kecepatan.
    # imu0_relative: true  → heading dihitung relatif dari posisi awal (bukan absolut/mag)
    #                         sehingga tidak terpengaruh orientasi robot saat startup.
    # Format: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    imu0: /imu/data_fixed
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: false
