/simple_scan_merger:
  ros__parameters:
    target_frame: base_link
    merged_topic: /scan
    scan_topics:
      - /front_scan
      - /rear_scan

    angle_min: -3.141592653589793
    angle_max: 3.141592653589793
    angle_increment: 0.00872664625  # ~0.5 derajat per step (360 deg / 720 bins)
    scan_time: 0.1
    range_min: 0.03
    range_max: 12.0

    min_height: -0.5
    max_height: 1.0

    use_tf: true
    transform_tolerance: 0.2
    qos_reliability: reliable     # "reliable" atau "best_effort"
    publish_rate: 10.0            # Frekuensi publish konstan (Hz)
    scan_timeout: 0.5             # Timeout keaktifan data scan (detik)
