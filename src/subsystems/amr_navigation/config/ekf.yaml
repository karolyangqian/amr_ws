ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    imu0_relative: true
    # Konfigurasi Nama Frame
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    # ===============================================
    # SENSOR 1: ODOMETRI RODA (dari odom_node.py)
    # ===============================================
    odom0: /odom
    # Matriks Konfigurasi: [X, Y, Z, Roll, Pitch, Yaw, Vx, Vy, Vz, Vroll, Vpitch, Vyaw, Ax, Ay, Az]
    # Fuse HANYA kecepatan Vx dan Vyaw dari encoder (TIDAK X, Y absolut)
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10
    # ===============================================
    # SENSOR 2: IMU BNO08x (dari Teensy)
    # ===============================================
    imu0: /imu/data_fixed
    # Matriks Konfigurasi: [X, Y, Z, Roll, Pitch, Yaw, Vx, Vy, Vz, Vroll, Vpitch, Vyaw, Ax, Ay, Az]
    # Fuse HANYA orientasi Yaw (arah hadap absolut dari IMU)
    # Vx dan Vyaw sudah dari encoder, jadi tidak perlu dari IMU
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_differential: false
    imu0_queue_size: 10